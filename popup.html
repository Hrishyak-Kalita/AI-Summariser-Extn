<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Summarizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h2>AI SUMMARIZER</h2>
    <div class="options">
      <select id="summary-type">
        <option value="brief">Brief</option>
        <option value="detailed">Detail</option>
        <option value="bullets">Bullets</option>
      </select>
    </div>
    <button id="summarize">Summarize</button>
    <button id="copy-btn">Copy</button>
    <pre id="result">Select a type and click Summarize</pre>

    <button id="bookmarkToggleBtn" style="display: none">Bookmark</button>
    <div id="bookmarkForm" style="display: none">
      <div id="bm-btn-box">
        <input type="text" id="labelInput" placeholder="Enter label/category" />

        <button id="bookmarkBtn">Save</button>
        <button id="cancelBookmarkBtn">Cancel</button>
      </div>
    </div>
    <button id="loadBookmarksBtn">View Bookmarks</button>
    <div id="bookmarksList" style="margin-top: 10px"></div>

    <script src="firebase-app-compat.js"></script>
    <script src="firebase-firestore-compat.js"></script>
    <script src="firebaseConfig.js"></script>
    <script src="popup.js"></script>
    <script src="content.js"></script>
